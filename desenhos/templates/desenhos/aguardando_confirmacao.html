<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 {% extends 'desenhos/base.html' %}

{% block title %}
Cadastro
{% endblock %}

{% block content %}

<div class="cadastro-card">
    <h2>Crie sua Conta</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Cadastrar e Enviar E-mail
        </button>
    </form>

    <p>
        Já tem conta?
        <a href="{% url 'login' %}">
            Faça Login
        </a>
    </p>
</div>

{% endblock %}   <title>Aguardando</title>
</head>
<body>
    <h2>Conta não confirmada</h2>
<p>
    Verifique seu e-mail e clique no link de ativação.
</p>
</body>
</html>
