{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header>

    <div class="logo">
        {% block logo %}
            Retrotoons
        {% endblock %}
    </div>

    <p class="subtitulo">
        {% block subtitulo %}
            Sua biblioteca inteligente de desenhos!
        {% endblock %}
    </p>

    <nav class="menu">
        <a href="{% url 'home' %}">Início</a>
        <a href="{% url 'biblioteca' %}">Biblioteca</a>
        <a href="{% url 'lista' %}">Suas Listas</a>
    </nav>

</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
