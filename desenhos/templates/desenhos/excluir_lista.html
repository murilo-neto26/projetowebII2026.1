{% extends 'desenhos/base.html' %}
{% block content %}
<h1>Excluir Lista</h1>
<p>
    Tem certeza que deseja excluir
    "{{ lista.nome }}"?
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">
        Sim, excluir
    </button>
</form>
<a href="{% url 'lista' %}">
    Cancelar
</a>
{% endblock %}
